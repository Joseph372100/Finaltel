<script>
// STORAGE — persistencia con localStorage resuelve recarga
function formatRol(rol) {
  return rol ? rol.replace(/_/g, ' ') : '—';
}

const DB_KEY = 'finantel_db_v4';
['finantel_db_v1','finantel_db_v2','finantel_db_v3'].forEach(k => localStorage.removeItem(k));

function dbLoad() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function dbSave(data) {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(data));
  } catch(e) { console.warn('Storage save failed:', e); }
}

// Datos iniciales 
const ASIENTOS_INICIALES = [];
const COMPROBANTES_INICIALES = [];
const RESPALDOS_INICIALES = [];
const USUARIOS_INICIALES = [];
const TC_INICIALES = [];
const AUDIT_INICIALES = [];

// Cargar 
let stored = dbLoad();
if (!stored) {
  stored = {
    asientos: ASIENTOS_INICIALES,
    comprobantes: COMPROBANTES_INICIALES,
    respaldos: RESPALDOS_INICIALES,
    usuarios: USUARIOS_INICIALES,
    tcData: TC_INICIALES,
    auditLog: AUDIT_INICIALES,
    nextCorrelativo: 1,
    nextCompNum: 1,
    tcActual: { usd:'—', eur:'—', mxn:'—', hora:'—' },
    periodos: []
  };
  dbSave(stored);
}

function duplicarAsientoExistente(id) {
  fetch(`/web/asientos/duplicar/${id}`, {
    credentials: 'include'
  })
  .then(r => {renderLibro
    if (r.ok) {
      renderAsientos();
      showToast(`Asiento duplicado correctamente`, 'success');
    } else {
      showToast('Error al duplicar asiento', 'error');
    }
  })
  .catch(() => showToast('Error de conexión', 'error'));
}

function anularAsiento(id) {
  const modalId = 'modal-anular';
  let modal = document.getElementById(modalId);
  if (!modal) { modal = document.createElement('div'); modal.className='modal-overlay'; modal.id=modalId; document.body.appendChild(modal); }
  modal.innerHTML = `
    <div class="modal" style="max-width:440px;">
      <h3 style="color:var(--red);">⚠ Anular Asiento — </h3>
      <div class="modal-sub">ELIMINACIÓN LÓGICA · El asiento NO se borra físicamente</div>
      <div class="alert alert-warn" style="margin-bottom:16px;">
        Asiento <strong style="font-family:'IBM Plex Mono',monospace;">${id}</strong> será marcado como <strong>ANULADO</strong>.<br>
        <span style="font-size:11px;">Permanece en historial de auditoría .</span>
      </div>
      <div class="fg" style="margin-bottom:16px;"><label class="field-req">Motivo de anulación</label>
        <textarea id="motivo-anular" placeholder="Describe el motivo..." style="background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:7px;font-size:13px;font-family:'IBM Plex Sans',sans-serif;min-height:70px;width:100%;resize:vertical;outline:none;"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-outline" onclick="closeModal('modal-anular')">Cancelar</button>
		<button class="btn-danger" onclick="confirmarAnular(${id})">🗑 Confirmar Anulación</button>
      </div>
    </div>`;
  modal.classList.add('open');
}

function confirmarAnular(id) {
  const motivo = document.getElementById('motivo-anular').value.trim();
  if (!motivo) { showToast('Ingresa el motivo de anulación', 'error'); return; }

    fetch(`/web/asientos/anular/${id}`, {
    method: 'PATCH',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' }
  })
  .then(r => {
    if (r.ok) {
      closeModal('modal-anular');
      renderAsientos();
      showToast(`Asiento ${id} anulado`, 'warn');
    } else {
      showToast('Error al anular el asiento', 'error');
    }
  })
  .catch(() => showToast('Error de conexión', 'error'));
}

function openNuevoAsiento() {
  const corrEl = document.getElementById('asiento-correlativo');
  const fechaEl = document.getElementById('asiento-fecha');
  if (corrEl) corrEl.value = getCurrentCorrelativo();
  if (fechaEl) fechaEl.value = new Date().toLocaleString('es-PE');
  // Limpiar form
  const tipoEl = document.getElementById('asiento-tipo');
  if (tipoEl) tipoEl.value = '';
  const descEl = document.getElementById('asiento-desc');
  if (descEl) descEl.value = '';
  document.getElementById('sugerencia-cuentas').style.display = 'none';
  const ocrR = document.getElementById('ocr-result');
  if (ocrR) { ocrR.style.display='none'; ocrR.innerHTML=''; }
  document.querySelectorAll('#asiento-lineas input[type=number]').forEach(i => i.value='');
  recalcTotals();
  document.getElementById('modal-asiento').classList.add('open');
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('open');
}

function guardarAsiento() {
  const tipo  = document.getElementById('asiento-tipo').value;
  const descEl = document.getElementById('asiento-desc');
  const desc  = descEl ? (descEl.options[descEl.selectedIndex]?.value !== '' ? descEl.options[descEl.selectedIndex]?.text : '') : '';

  if (!tipo) { showToast('Tipo de asiento es obligatorio','error'); document.getElementById('asiento-tipo').style.borderColor='var(--red)'; return; }

  let debe=0, haber=0;
  document.querySelectorAll('#asiento-lineas .asiento-line').forEach(row => {
    const inputs = row.querySelectorAll('input[type=number]');
    debe  += parseFloat(inputs[0]?.value||0);
    haber += parseFloat(inputs[1]?.value||0);
  });

  if (debe === 0 && haber === 0) { showToast('Ingresa montos en las partidas','error'); return; }
  if (Math.abs(debe-haber) > 0.01) { showToast('El asiento no cuadra — Diferencia: S/ '+Math.abs(debe-haber).toFixed(2),'error'); return; }

  const nuevoId  = getCurrentCorrelativo();
  const usuario  = document.getElementById('user-name-hdr').textContent;
  const tipoLabel= tipo.charAt(0).toUpperCase()+tipo.slice(1);
  const descLabel= (desc && desc !== '— Seleccionar o escribir —') ? desc : tipoLabel;

  // Recoger partidas
  const partidas = [];
  document.querySelectorAll('#asiento-lineas .asiento-line').forEach(row => {
    const sel = row.querySelector('select');
    const txt = row.querySelector('input[type=text]');
    const inputs = row.querySelectorAll('input[type=number]');
    partidas.push({ cuenta: sel?.value||'', glosa: txt?.value||'', debe: parseFloat(inputs[0]?.value||0), haber: parseFloat(inputs[1]?.value||0) });
  });

  fetch('/web/asientos', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      tipo: tipoLabel,
      descripcion: descLabel,
      debe: debe,
      haber: haber,
      estado: 'Activo',
      usuario: usuario,
	  cuentaContable: (partidas[0]?.cuenta || '1011').split(' ')[0],
      centroCosto: 'General',
      moneda: 'PEN',
      tipoCambio: 1.0
    })
  })
  .then(r => {
    if (r.ok) {
      renderAsientos();
      closeModal('modal-asiento');
      showPanel('asientos');
      showToast('Asiento guardado correctamente', 'success');
	  document.getElementById('asiento-tipo').value = '';
	  document.getElementById('asiento-desc').value = '';
	  document.querySelectorAll('#asiento-lineas input[type=number]').forEach(i => i.value = '');
	  document.querySelectorAll('#asiento-lineas input[type=text]').forEach(i => i.value = '');
	  document.getElementById('sugerencia-cuentas').style.display = 'none';
	  recalcTotals();
    } else {
      showToast('Error al guardar asiento', 'error');
    }
  })
  .catch(() => showToast('Error de conexión', 'error'));
}

function addAsientoLine() {
  const container = document.getElementById('asiento-lineas');
  const div = document.createElement('div');
  div.className = 'asiento-line';
  div.innerHTML = `
    <select style="background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:12px;">
      <option>1011 — Caja</option><option>1301 — Créditos Vigentes</option><option>2101 — Dep. Ahorro</option>
      <option>2102 — Dep. Plazo</option><option>4101 — Int. Depósitos</option><option>4401 — Provisiones</option>
      <option>4501 — Gastos Personal</option><option>4601 — Depreciación</option><option>5101 — Int. Créditos</option>
      <option>5102 — Int. Inversiones</option>
    </select>
    <input type="text" placeholder="Descripción de la partida" style="background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:12px;"/>
    <input type="number" placeholder="0.00" style="background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:12px;text-align:right;" oninput="recalcTotals()"/>
    <input type="number" placeholder="0.00" style="background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:12px;text-align:right;" oninput="recalcTotals()"/>
    <button onclick="this.closest('.asiento-line').remove();recalcTotals();" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:14px;">×</button>`;
  container.appendChild(div);
}

function recalcTotals() {
  let debe=0,haber=0;
  document.querySelectorAll('#asiento-lineas .asiento-line').forEach(row => {
    const inputs = row.querySelectorAll('input[type=number]');
    debe  += parseFloat(inputs[0]?.value||0);
    haber += parseFloat(inputs[1]?.value||0);
  });
  document.getElementById('total-debe').textContent  = 'S/ '+debe.toFixed(2);
  document.getElementById('total-haber').textContent = 'S/ '+haber.toFixed(2);
  const diff = Math.abs(debe-haber);
  const cs = document.getElementById('cuadre-status');
  if (diff < 0.01 && debe > 0) cs.innerHTML = '✓ <strong style="color:var(--green)">CUADRADO ✓</strong>';
  else cs.innerHTML = `⚡ Diferencia: <strong style="color:#fbbf24;">S/ ${diff.toFixed(2)}</strong>`;
}

function sugerirCuentas() {
  const tipo = document.getElementById('asiento-tipo').value;
  const sug = document.getElementById('sugerencia-cuentas');
  const txt = document.getElementById('sugerencia-text');
  if (tipo) document.getElementById('asiento-tipo').style.borderColor = '';
  const sugs = {
    credito:   'Débito: 1301 Créditos Vigentes — Crédito: 1011 Caja / 1041 Cta. Cte.',
    deposito:  'Débito: 1011 Caja — Crédito: 2101 Dep. Ahorro / 2102 Dep. Plazo',
    cobro:     'Débito: 1011 Caja — Crédito: 1301 Créditos Vigentes + 5101 Intereses',
    planilla:  'Débito: 4501 Gastos Personal — Crédito: 1011 Caja',
    provision: 'Débito: 4401 Provisiones — Crédito: 1399 Provisión Acumulada',
    apertura:  'Débito: Activos — Crédito: Pasivos + Patrimonio',
    ajuste:    'Según naturaleza del ajuste. Verificar saldos.',
    cierre:    'Débito: Ingresos (5xxx) — Crédito: Gastos (4xxx) → resultado',
  };
  if (sugs[tipo]) { txt.textContent = sugs[tipo]; sug.style.display='flex'; }
  else sug.style.display='none';
}

function duplicarAsiento() {
  closeModal('modal-asiento');
  const tipo = document.getElementById('asiento-tipo').value;
  showToast('Para duplicar un asiento existente, usa el botón 📋 en la tabla de asientos', 'info');
}

function processOCRModal(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  const ocrEl = document.getElementById('ocr-result');
  if (!ocrEl) return;
  ocrEl.style.display = 'flex';
  ocrEl.className = 'alert alert-info';
  ocrEl.innerHTML = '⏳ Procesando archivo: <strong>' + file.name + '</strong>...';

  const formData = new FormData();
  formData.append('archivo', file);

  fetch('/ocr/leer', {
    method: 'POST',
    credentials: 'include',
    body: formData
  })
  .then(r => r.text())
  .then(texto => {
    ocrEl.className = 'alert alert-success';
    ocrEl.innerHTML = '✓ <strong>Texto extraído:</strong><br>'
      + '<pre style="font-size:11px;font-family:\'IBM Plex Mono\',monospace;white-space:pre-wrap;margin-top:8px;">'
      + texto + '</pre>';
  })
  .catch(() => {
    ocrEl.className = 'alert alert-danger';
    ocrEl.innerHTML = '✕ Error al procesar el archivo.';
  });
}
function processOCRFile(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  const resultEl = document.getElementById('ocr-result-page');
  if (!resultEl) return;
  resultEl.style.display='flex';
  resultEl.className='alert alert-info';
  resultEl.innerHTML = `⏳ Procesando: <strong>${file.name}</strong>...`;
  setTimeout(() => {
    const fecha = new Date().toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'});
    const monto = (Math.random()*5000+200).toFixed(2);
    const factNum = 'F00'+Math.floor(Math.random()*9+1)+'-'+String(Math.floor(Math.random()*99999)).padStart(5,'0');
    resultEl.className='alert alert-success';
    resultEl.innerHTML = `✓ <strong> — Documento recibido:</strong> ${file.name} · ${(file.size/1024).toFixed(1)} KB<br>
      <span style="font-size:11px;font-family:'IBM Plex Mono',monospace;">
        📅 Fecha detectada: ${fecha} · 🧾 N°: ${factNum} · 💰 Monto: S/ ${monto}<br>
        Datos listos para validar contra asiento contable. Ingresa el número de asiento para comparar.
      </span>`;
    showToast(`Archivo ${file.name} procesado. Revisa los datos extraídos.`, 'success');
    logAudit(document.getElementById('user-name-hdr').textContent, 'OCR', file.name, '—', `${file.name} — S/ ${monto}`);
  }, 1800);
}

function processExcelFile(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  const preview = document.getElementById('excel-preview');
  if (preview) { preview.style.display='block'; preview.innerHTML='<div class="alert alert-info">⏳ Importando: <strong>'+file.name+'</strong>...</div>'; }

  const formData = new FormData();
  formData.append('archivo', file);

  fetch('/web/importar-excel', {
    method: 'POST',
    credentials: 'include',
    body: formData
  })
  .then(r => r.text())
  .then(msg => {
    if (preview) preview.innerHTML = '<div class="alert alert-success">✓ ' + msg + '</div>';
    showToast(msg, 'success');
    renderAsientos();
  })
  .catch(() => showToast('Error al importar', 'error'));
}
function renderLibro() {
  const el = document.getElementById('libro-entries');
  if (!el) return;

  fetch('/web/asientos', { credentials: 'include' })
  .then(r => r.json())
  .then(asientos => {
    const activos = asientos.filter(a => a.estado === 'Activo');
    if (!activos.length) {
      el.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;">Sin asientos registrados</div>';
      return;
    }

    let totalDebe = 0, totalHaber = 0, saldo = 0;
    el.innerHTML = activos.map(a => {
      const debe  = parseFloat(a.debe) || 0;
      const haber = parseFloat(a.haber) || 0;
      totalDebe  += debe;
      totalHaber += haber;
      saldo      += debe - haber;
      const fecha = a.fechaRegistro ? new Date(a.fechaRegistro).toLocaleDateString('es-PE') : '—';
	  return `<div class="ldg-row" style="border-left:2px solid ${debe>haber?'var(--green)':debe<haber?'var(--red)':'var(--border)'};padding-left:11px;">
	    <span style="color:var(--muted);font-size:11px;">${fecha}</span>
	    <span style="font-weight:500;">${a.descripcion || '—'}</span>
	    <span style="text-align:center;"><span class="badge b-teal" style="font-size:9px;">${a.cuentaContable || '—'}</span></span>
	    <span style="text-align:right;color:var(--green-light);font-weight:600;">${debe>0?'S/ '+debe.toLocaleString('es-PE',{minimumFractionDigits:2}):'—'}</span>
	    <span style="text-align:right;color:var(--red-light);font-weight:600;">${haber>0?'S/ '+haber.toLocaleString('es-PE',{minimumFractionDigits:2}):'—'}</span>
	    <span style="text-align:right;color:${saldo>=0?'var(--teal)':'var(--red)'};font-weight:600;">S/ ${saldo.toLocaleString('es-PE',{minimumFractionDigits:2})}</span>
	  </div>`;
    }).join('');

    const kpis = document.querySelectorAll('#panel-libro .kpi-val');
    if (kpis[0]) kpis[0].textContent = activos.length;
    if (kpis[1]) kpis[1].textContent = 'S/ ' + totalDebe.toLocaleString('es-PE');
    if (kpis[2]) kpis[2].textContent = 'S/ ' + totalHaber.toLocaleString('es-PE');
    if (kpis[3]) kpis[3].textContent = 'S/ ' + Math.abs(totalDebe - totalHaber).toLocaleString('es-PE');
  })
  .catch(() => {
    el.innerHTML = '<div style="text-align:center;color:var(--red);padding:20px;">Error cargando libro diario</div>';
  });
}
function renderComprobantes() {
  const tbody = document.querySelector('#panel-comprobantes table tbody');
  if (!tbody) return;

  fetch('/web/comprobantes', { credentials: 'include' })
  .then(r => r.json())
  .then(comprobantes => {
    if (!comprobantes.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px;">Sin comprobantes registrados</td></tr>';
      return;
    }
    tbody.innerHTML = comprobantes.map(c => {
      const badgeTipo = c.tipo==='Factura'?'b-blue':c.tipo==='Boleta'?'b-teal':'b-gold';
      const badgeEst  = c.estado==='Emitido'?'b-green':'b-gold';
      return `<tr>
        <td style="font-family:'IBM Plex Mono',monospace;">${c.numero || '—'}</td>
        <td>${c.fecha || '—'}</td>
        <td><span class="badge ${badgeTipo}">${c.tipo || '—'}</span></td>
        <td>${c.cliente || '—'}</td>
        <td class="tr" style="font-family:'IBM Plex Mono',monospace;">S/ ${c.monto || '0.00'}</td>
        <td><span class="badge ${badgeEst}">${c.estado || '—'}</span></td>
        <td><button class="btn-outline btn-sm" onclick="descargarComprobante('${c.numero}')">📄 PDF</button></td>
      </tr>`;
    }).join('');
  })
  .catch(() => {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--red);">Error cargando comprobantes</td></tr>';
  });
}

function emitirComprobante() {
  const modalId = 'modal-comprobante';
  let modal = document.getElementById(modalId);
  if (!modal) { modal=document.createElement('div'); modal.className='modal-overlay'; modal.id=modalId; document.body.appendChild(modal); }
  modal.innerHTML = `
    <div class="modal" style="max-width:520px;">
      <h3>🧾 Emitir Comprobante — </h3>
      <div class="modal-sub">NUEVA EMISIÓN</div>
      <div style="display:flex;flex-direction:column;gap:12px;">

function renderRespaldos() {
  const tbody = document.querySelector('#sub-respaldos table tbody');
  if (!tbody) return;

  fetch('/web/respaldos', { credentials: 'include' })
  .then(r => r.json())
  .then(respaldos => {
    if (!respaldos.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px;">Sin respaldos registrados</td></tr>';
      return;
    }
    tbody.innerHTML = respaldos.map(r => {
      const tipoBadge = r.tipo==='Manual'?'b-blue':r.tipo==='Diario'?'b-green':r.tipo==='Semanal'?'b-gold':'b-teal';
      return `<tr>
        <td style="font-family:'IBM Plex Mono',monospace;font-size:11px;">${r.fecha}</td>
        <td><span class="badge ${tipoBadge}">${r.tipo}</span></td>
        <td>${r.tamanio}</td>
        <td>${r.usuario}</td>
        <td><span class="badge b-green">${r.estado}</span></td>
        <td><button class="btn-outline btn-sm" onclick="restaurarRespaldo('${r.fecha}')">Restaurar</button></td>
      </tr>`;
    }).join('');
  })
  .catch(() => showToast('Error cargando respaldos', 'error'));
  // Cargar estado de switches
  fetch('/web/config-respaldos', { credentials: 'include' })
  .then(r => r.json())
  .then(configs => {
    const checkboxes = document.querySelectorAll('#sub-respaldos input[type=checkbox]');
	configs.forEach(c => {
	  if (c.tipo === 'Diario') checkboxes[0].checked = c.activo == 1;
	  else if (c.tipo === 'Semanal') checkboxes[1].checked = c.activo == 1;
	  else if (c.tipo === 'Mensual') checkboxes[2].checked = c.activo == 1;
	});

	// Actualizar alerta
	const activados = configs.filter(c => c.activo == 1).map(c => {
	  if (c.tipo === 'Diario') return 'Diario 02:00 AM';
	  if (c.tipo === 'Semanal') return 'Semanal 03:00 AM';
	  if (c.tipo === 'Mensual') return 'Mensual 04:00 AM';
	}).join(', ');
	const alerta = document.querySelector('#sub-respaldos .alert-success');
	if (alerta) {
	  if (activados) alerta.innerHTML = `✓ Respaldos activos: <strong>${activados}</strong>`;
	  else alerta.innerHTML = `⚠ No hay respaldos programados activos.`;
	  alerta.className = activados ? 'alert alert-success' : 'alert alert-warn';
	  }
	});
}

  const trigger = btn || event?.target || document.activeElement;
  if (trigger) { trigger.disabled = true; trigger.textContent = '⏳ Creando...'; }
  showToast('Creando respaldo manual...', 'info');

  fetch('/web/respaldos', {
    method: 'POST',
    credentials: 'include'
  })
  .then(r => {

      renderRespaldos();
      if (trigger) { trigger.disabled = false; trigger.textContent = '+ Respaldo Manual'; }

    showToast('Error de conexión', 'error');

function openModalUsuario() { document.getElementById('modal-usuario').classList.add('open'); }
function guardarUsuario() {
  const nombre = document.querySelector('#modal-usuario input[type=text]')?.value.trim();
  const email  = document.querySelector('#modal-usuario input[type=email]')?.value.trim();
  const pass   = document.querySelector('#modal-usuario input[type=password]')?.value;
  const rolEl  = document.querySelector('#modal-usuario select');
  const rol    = rolEl?.value;
  const dni = document.getElementById('modal-dni')?.value.trim();
  const tel = document.getElementById('modal-tel')?.value.trim();

  let errores = [];
  if (!nombre) errores.push('Nombre es obligatorio');
  if (!email || !email.includes('@')) errores.push('Email inválido');
  if (!pass || pass.length < 8) errores.push('Contraseña mín. 8 caracteres');
  if (!rol || rol.startsWith('—')) errores.push('Selecciona un rol');
  if (dni && !/^\d{8}$/.test(dni)) errores.push('DNI debe tener exactamente 8 dígitos');
  if (tel) {
    if (!/^\d{9}$/.test(tel)) errores.push('Teléfono debe tener exactamente 9 dígitos');
    else if (!tel.startsWith('9')) errores.push('Teléfono debe empezar en 9');
  }
  if (errores.length) { errores.forEach(e => showToast(e, 'error')); return; }
  fetch('/web/usuarios', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
	body: JSON.stringify({ nombre, email, password: pass, rol, estado: 'Activo', intentos: 0, dni, telefono: tel })
  })
  .then(r => {
    if (r.ok) {
      showToast('Usuario ' + nombre + ' creado correctamente', 'success');
      closeModal('modal-usuario');
      renderUsuarios();
      document.querySelector('#modal-usuario input[type=text]').value = '';
      document.querySelector('#modal-usuario input[type=email]').value = '';
      document.querySelector('#modal-usuario input[type=password]').value = '';
      if (rolEl) rolEl.value = rolEl.options[0].value;
	  document.getElementById('modal-dni').value = '';
	  document.getElementById('modal-tel').value = '';
    } else {
      showToast('Error al crear usuario', 'error');
    }
  })
  .catch(() => showToast('Error de conexión', 'error'));
}

function applyConfigToUI() {
  const root = document.getElementById('sub-configuracion');
  const cfg = stored.config || {};
  if (!root) return;
  const fields = root.querySelectorAll('.card input, .card select, .card textarea');
  if (fields[0]) fields[0].value = cfg.razonSocial || fields[0].value;
  if (fields[1]) fields[1].value = cfg.ruc || fields[1].value;
  if (fields[2]) fields[2].value = cfg.direccion || fields[2].value;
  if (fields[3]) fields[3].value = cfg.email || fields[3].value;
  if (fields[4]) fields[4].value = cfg.web || fields[4].value;
  if (fields[5]) fields[5].value = cfg.moneda || fields[5].value;
  const checks = root.querySelectorAll('input[type=checkbox]');
  if (checks[0]) checks[0].checked = cfg.aprobacionDoble ?? checks[0].checked;
  if (checks[1]) checks[1].checked = cfg.alertasAutomaticas ?? checks[1].checked;
  if (checks[2]) checks[2].checked = cfg.ocrAutomatico ?? checks[2].checked;

function saveInconsistencyState(id, estado) {
  stored.inconsistencias = stored.inconsistencias || {};
  stored.inconsistencias[id] = Object.assign({ actualizado: new Date().toLocaleString('es-PE') }, estado);
  saveAll();
}

}

function corregirInconsistencia(id) {
  const row = getInconsistencyRow(id);

  if (asiento) {
    asiento.estado = 'En corrección';

    renderAsientos();

function exportAuditCSV() {

        .map(function(td){ return '"'+td.textContent.trim().replace(/"/g,'""')+'"'; }).join(',');

function confirmarCambioPassword(id) {
  const actual    = document.getElementById('cp-actual').value;
  const nueva     = document.getElementById('cp-nueva').value;
  const confirmar = document.getElementById('cp-confirmar').value;

  if (!actual) { showToast('Ingresa tu contraseña actual', 'error'); return; }
  if (!nueva || nueva.length < 8) { showToast('La nueva contraseña debe tener mínimo 8 caracteres', 'error'); return; }
  if (nueva !== confirmar) { showToast('Las contraseñas no coinciden', 'error'); return; }

  fetch(`/web/usuarios/${id}/password`, {
    method: 'PATCH',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ passwordActual: actual, passwordNueva: nueva })
  })
  .then(r => {
    if (r.ok) {
      closeModal('modal-cambiar-pass');
      showToast('Contraseña cambiada correctamente', 'success');
    } else {
      r.text().then(msg => showToast(msg || 'Contraseña actual incorrecta', 'error'));
    }
  })
  .catch(() => showToast('Error de conexión', 'error'));
}

function showToast(msg, type='info') {
  const icons = { success:'✓', error:'✕', warn:'⚠', info:'ℹ' };
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.innerHTML = `<span>${icons[type]||'ℹ'}</span><span>${msg}</span>`;

  const container = document.getElementById('toast-container');
  if (!container) return;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity='0';
    toast.style.transform='translateX(120%)';
    toast.style.transition='all .3s';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}
function logAudit(user, accion, objeto, anterior, nuevo) {
  if (!stored.auditLog) stored.auditLog = [];
  stored.auditLog.unshift({
    fecha: new Date().toLocaleString('es-PE'),
    user: user || '—',
    accion: accion || '—',
    objeto: objeto || '—',
    anterior: anterior || '—',
    nuevo: nuevo || '—'
  });
  saveAll();
  renderAuditLog();
}

function renderAuditLog() {
  const tbody = document.querySelector('#sub-auditoria table tbody');
  if (!tbody) return;

  fetch('/web/auditoria', { credentials: 'include' })
  .then(r => r.json())
  .then(logs => {
    if (!logs.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px;">Sin registros de auditoría</td></tr>';
      return;
    }
    tbody.innerHTML = logs.map(e => `
      <tr>
        <td style="font-size:11px;font-family:'IBM Plex Mono',monospace;">${e.fecha || '—'}</td>
        <td>${e.usuario || '—'}</td>
        <td><span class="badge b-teal">${e.accion || '—'}</span></td>

function guardarEdicionAsiento(id) {
  console.log('Editando asiento id:', id);
  const tipo   = document.getElementById('ea-tipo').value;
  const desc   = document.getElementById('ea-desc').value.trim();
  const estado = document.getElementById('ea-estado').value;

  fetch(`/web/asientos/${id}`, {
    method: 'PUT',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tipo, descripcion: desc, estado })

function renderBalance() {
  fetch('/web/balance', { credentials: 'include' })
  .then(r => r.json())
  .then(saldos => {
    const activos = {}, pasivos = {}, patrimonio = {};
    const cuentasActivo = ['1011','1301','1399'];
    const cuentasPasivo = ['2011','2101','2102','4011','4101','4401'];
    const cuentasPatrimonio = ['5011','5101','5102'];

	Object.entries(saldos).forEach(([cta, data]) => {
	    const saldo = data.saldo;
	    const desc = data.descripcion;
	    if (cta.charAt(0) === '1') activos[cta] = {saldo, desc};
	    else if (cta.charAt(0) === '2' || cta.charAt(0) === '4') pasivos[cta] = {saldo, desc};
	    else if (cta.charAt(0) === '5') patrimonio[cta] = {saldo, desc};
	});

	const renderRows = (obj, tbody) => {
	  if (!tbody) return 0;
	  let total = 0;
	  const totalSaldo = Object.values(obj).reduce((a, b) => a + b.saldo, 0);
	  tbody.innerHTML = Object.entries(obj).map(([cta, data]) => {
	    total += data.saldo;
	    const pct = totalSaldo !== 0 ? ((data.saldo / totalSaldo) * 100).toFixed(1) : '0.0';
	    return '<tr>'
	      + '<td style="font-family:\'IBM Plex Mono\',monospace;">' + cta + '</td>'
	      + '<td>' + (data.desc || cta) + '</td>'
	      + '<td class="tr">S/ ' + data.saldo.toLocaleString('es-PE', {minimumFractionDigits:2}) + '</td>'
	      + '<td class="tr">' + pct + '%</td>'
	      + '</tr>';
	  }).join('') + '<tr class="tot-row"><td colspan="2">TOTAL</td><td class="tr">S/ ' + total.toLocaleString('es-PE', {minimumFractionDigits:2}) + '</td><td></td></tr>';
	  return total;
	};

    const tbActivo = document.querySelector('#panel-balance .two-col > div:first-child table tbody');
    const tbPasivo = document.querySelector('#panel-balance .two-col > div:last-child > div:first-child table tbody');
    const tbPatrimonio = document.querySelector('#panel-balance .two-col > div:last-child > div:last-child table tbody');

    renderRows(activos, tbActivo);
    renderRows(pasivos, tbPasivo);
    renderRows(patrimonio, tbPatrimonio);
  })
  .catch(() => showToast('Error cargando balance', 'error'));
}
function renderResultados() {
  fetch('/web/resultados', { credentials: 'include' })
  .then(r => r.json())
  .then(data => {
    const tbody = document.querySelector('#panel-resultados table tbody');
    if (!tbody) return;
    let totalIngresos = 0, totalGastos = 0;
    const rows = [];
    Object.entries(data).forEach(([cta, info]) => {
      if (info.tipo === '5') totalIngresos += info.saldo;
      else totalGastos += info.saldo;
      rows.push({ cta, info });
    });
    const utilidad = totalIngresos - totalGastos;
    tbody.innerHTML = 
      '<tr class="sec-row"><td colspan="3">INGRESOS</td></tr>'
      + rows.filter(r => r.info.tipo === '5').map(({cta, info}) =>
        '<tr><td style="font-family:\'IBM Plex Mono\',monospace;">' + cta + '</td>'
        + '<td>' + (info.descripcion || cta) + '</td>'
        + '<td class="tr pos">S/ ' + info.saldo.toLocaleString('es-PE',{minimumFractionDigits:2}) + '</td></tr>'
      ).join('')
      + '<tr class="sub-row"><td colspan="2">Total Ingresos</td><td class="tr">S/ ' + totalIngresos.toLocaleString('es-PE',{minimumFractionDigits:2}) + '</td></tr>'
      + '<tr class="sec-row"><td colspan="3">GASTOS</td></tr>'
      + rows.filter(r => r.info.tipo === '4').map(({cta, info}) =>
        '<tr><td style="font-family:\'IBM Plex Mono\',monospace;">' + cta + '</td>'
        + '<td>' + (info.descripcion || cta) + '</td>'
        + '<td class="tr neg">S/ ' + info.saldo.toLocaleString('es-PE',{minimumFractionDigits:2}) + '</td></tr>'
      ).join('')
      + '<tr class="sub-row"><td colspan="2">Total Gastos</td><td class="tr">S/ ' + totalGastos.toLocaleString('es-PE',{minimumFractionDigits:2}) + '</td></tr>'
      + '<tr class="tot-row"><td colspan="2">UTILIDAD NETA</td>'
      + '<td class="tr ' + (utilidad >= 0 ? 'pos' : 'neg') + '">S/ ' + utilidad.toLocaleString('es-PE',{minimumFractionDigits:2}) + '</td></tr>';
  })
  .catch(() => showToast('Error cargando estado de resultados', 'error'));
}
function renderFlujo() {

function renderRatios() {
  fetch('/web/ratios', { credentials: 'include' })
  .then(r => r.json())
  .then(data => {
    const lc = data.liquidezCorriente || 0;
    const roe = data.roe || 0;
    const roa = data.roa || 0;
    const mn = data.margenNeto || 0;

    const ratioCards = document.querySelectorAll('#panel-ratios .ratio-val');
    const ratioSt = document.querySelectorAll('#panel-ratios .ratio-st');

    if (ratioCards[0]) ratioCards[0].textContent = lc.toFixed(2);
    if (ratioCards[1]) ratioCards[1].textContent = '—';
    if (ratioCards[2]) ratioCards[2].textContent = '—';
    if (ratioCards[3]) ratioCards[3].textContent = roa.toFixed(1) + '%';
    if (ratioCards[4]) ratioCards[4].textContent = roe.toFixed(1) + '%';
    if (ratioCards[5]) ratioCards[5].textContent = mn.toFixed(1) + '%';

    if (ratioSt[0]) { ratioSt[0].textContent = lc >= 1.5 ? '✓ Óptimo' : '⚠ Revisar'; ratioSt[0].className = 'ratio-st ' + (lc >= 1.5 ? 'st-ok' : 'st-warn'); }
    if (ratioSt[3]) { ratioSt[3].textContent = roa >= 1.9 ? '✓ Óptimo' : '⚠ Revisar'; ratioSt[3].className = 'ratio-st ' + (roa >= 1.9 ? 'st-ok' : 'st-warn'); }
    if (ratioSt[4]) { ratioSt[4].textContent = roe >= 11.5 ? '✓ Óptimo' : '⚠ Revisar'; ratioSt[4].className = 'ratio-st ' + (roe >= 11.5 ? 'st-ok' : 'st-warn'); }
    if (ratioSt[5]) { ratioSt[5].textContent = mn >= 8.2 ? '✓ Óptimo' : '⚠ Revisar'; ratioSt[5].className = 'ratio-st ' + (mn >= 8.2 ? 'st-ok' : 'st-warn'); }
  })
  .catch(() => showToast('Error cargando ratios', 'error'));
}
function renderCostos() {
  fetch('/web/costos', { credentials: 'include' })
  .then(r => r.json())
  .then(data => {
    const tbody = document.querySelector('#panel-costos table tbody');
    if (!tbody) return;
    const total = Object.values(data).reduce((a,b) => a+b, 0);
    tbody.innerHTML = Object.entries(data).map(([centro, ejecutado]) => {
      const pct = total > 0 ? ((ejecutado/total)*100).toFixed(1) : '0.0';
      const presupuesto = ejecutado * 1.2;
      const variacion = presupuesto - ejecutado;
      const st = ejecutado <= presupuesto ? 'b-green' : 'b-red';
      return '<tr>'
        + '<td>' + centro + '</td>'
        + '<td class="tr">S/ ' + presupuesto.toLocaleString('es-PE',{minimumFractionDigits:2}) + '</td>'
        + '<td class="tr">S/ ' + ejecutado.toLocaleString('es-PE',{minimumFractionDigits:2}) + '</td>'
        + '<td class="tr pos">S/ ' + variacion.toLocaleString('es-PE',{minimumFractionDigits:2}) + '</td>'
        + '<td class="tr">' + pct + '%</td>'
        + '<td><span class="badge ' + st + '">' + (ejecutado <= presupuesto ? 'En presupuesto' : 'Excedido') + '</span></td>'
        + '</tr>';
    }).join('');
  })
  .catch(() => showToast('Error cargando costos', 'error'));
}

	if (amts[5]) amts[5].textContent = 'S/ '+(data.gasMarzo||0).toLocaleString('es-PE');
	  })
	  .catch(() => showToast('Error cargando alertas', 'error'));

	    fetch('/web/inconsistencias', { credentials: 'include' })

	  function toggleUserMenu() {

	  document.addEventListener('click', function(e) {

	  function descargarPlantilla() {
